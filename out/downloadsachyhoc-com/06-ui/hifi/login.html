<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--surface:#fff;--muted:#eef3f2;--border:#d6e0de;--text:#122522;--tmut:#5a6b68;--teal:#0f766e;--tealH:#0b5c55}
*{box-sizing:border-box}body{margin:0;font-family:'Inter','Be Vietnam Pro',system-ui,sans-serif;color:var(--text)}
h2{font-family:'Be Vietnam Pro',system-ui,sans-serif}
.bgstage{position:fixed;inset:0;background:#f7faf9;overflow:hidden}
.bgblur{filter:blur(3px);opacity:.5;padding:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.bc{aspect-ratio:3/4;border-radius:12px;background:linear-gradient(135deg,#dbe8e6,#c6d8d5)}
.scrim{position:fixed;inset:0;background:rgba(9,26,24,.55);display:grid;place-items:center;padding:20px}
.modal{width:360px;background:var(--surface);border-radius:16px;padding:28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:14px;position:relative}
.close{position:absolute;top:14px;right:14px;color:var(--tmut);cursor:pointer}
.mlogo{width:44px;height:44px;border-radius:11px;background:var(--teal);display:grid;place-items:center;color:#fff;margin:0 auto}
h2{margin:2px 0 0;text-align:center;font-size:20px}
.sub{text-align:center;color:var(--tmut);font-size:13px;margin:-6px 0 4px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--tmut);font-weight:600}
label.f input{border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:14px;outline:0;font-family:inherit;color:var(--text)}
label.f input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--tmut)}
.row a{color:var(--teal);font-weight:600}
.cta{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.cta:hover{background:var(--tealH)}
.or{display:flex;align-items:center;gap:10px;color:#9aa8a5;font-size:12px;font-weight:600}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--border)}
.goog{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:11px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;background:#fff}
.foot{text-align:center;font-size:13px;color:var(--tmut)}.foot a{color:var(--teal);font-weight:600}
svg{display:block}
</style></head>
<body>
<div class="bgstage"><div class="bgblur"><div class="bc"></div><div class="bc"></div><div class="bc"></div><div class="bc"></div><div class="bc"></div><div class="bc"></div><div class="bc"></div><div class="bc"></div><div class="bc"></div><div class="bc"></div></div></div>
<div class="scrim">
  <div class="modal">
    <span class="close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
    <div class="mlogo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3z"/><path d="M12 4v16"/></svg></div>
    <h2>Đăng nhập</h2>
    <div class="sub">Đăng nhập để tải sách và quản lý thư viện của bạn</div>
    <label class="f">Tên tài khoản hoặc email<input placeholder="bacsi@example.com"></label>
    <label class="f">Mật khẩu<input type="password" placeholder="••••••••"></label>
    <div class="row"><label><input type="checkbox" style="accent-color:#0f766e"> Ghi nhớ</label><a>Quên mật khẩu?</a></div>
    <button class="cta">Đăng nhập</button>
    <div class="foot">Chưa có tài khoản? <a>Đăng ký ngay</a></div>
    <div class="sub" style="margin:2px 0 0">Chỉ cần tên tài khoản và mật khẩu — đăng nhập là tải được mọi cuốn sách.</div>
  </div>
</div>
</body></html>
